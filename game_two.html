<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6f8" />
  <title>Lights Out</title>
  <link rel="icon" href="faviconLO.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="lights.css" />
  <script src="fit.js" defer></script>
  <style>
    :root { --accent: #7a6c00; --accent-tint: var(--lights-tint); }
    html, body { overflow: hidden; }
    .shell { width: min(100%, 34rem); padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    .topbar { padding: .25rem 0 .5rem; }
    .btn { background: var(--lights); color: var(--lights-ink); }
    .btn:hover { background: var(--lights-strong); }

    .stats { margin-bottom: .75rem; }
    .goal { margin: 0 auto .875rem; max-width: 30ch; text-align: center; color: var(--ink-2); font-size: .9375rem; text-wrap: balance; }
    .goal strong { color: var(--ink); font-weight: 600; }

    .levels {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: .25rem;
      padding: .25rem; margin: 0 0 .875rem;
      background: var(--surface-2); border-radius: 1rem; border: 0;
    }
    .levels legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .levels label { position: relative; }
    .levels input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .levels span {
      display: grid; place-items: center; min-height: 2.75rem; padding: .125rem .25rem;
      border-radius: .75rem; font-size: .875rem; font-weight: 700; color: var(--ink-2); text-align: center; line-height: 1.15;
      transition: background .2s, color .2s, box-shadow .2s;
    }
    .levels small { display: block; font-size: .6875rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .levels input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .levels input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 1px; }

    /* board: a soft white tray of rounded keys; lit keys turn warm yellow */
    .board-wrap {
      padding: clamp(.875rem, 4vw, 1.375rem);
      border-radius: 1.75rem; border: 0;
      background: linear-gradient(180deg, #ffffff, #fbfaf3);
      box-shadow: 0 1px 2px rgb(29 33 37 / .05), 0 12px 32px rgb(120 100 0 / .10);
    }
    .board {
      --n: 3;
      display: grid; grid-template-columns: repeat(var(--n), 1fr);
      gap: clamp(.375rem, 2vw, .75rem);
      width: min(100%, calc(var(--n) * 6.25rem));
      margin: 0 auto;
    }
    .cell {
      position: relative; aspect-ratio: 1; display: grid; place-items: center;
      padding: 14%; border: 0; border-radius: 28%;
      background: #f1f2f5;
      box-shadow: inset 0 -3px 0 rgb(29 33 37 / .06), inset 0 1px 0 #fff;
      cursor: pointer;
      transition: background .3s var(--ease), box-shadow .35s var(--ease), transform .25s cubic-bezier(.2, 1.1, .3, 1);
    }
    .cell img { width: 100%; height: 100%; pointer-events: none; opacity: .55; transition: opacity .25s, transform .35s cubic-bezier(.2, 1.1, .3, 1); }
    .cell:hover { background: #e9ebef; }
    .cell:active { transform: scale(.92); }
    .cell[aria-pressed="true"] {
      background: radial-gradient(circle at 50% 40%, #fffbd2, #ffe970 75%);
      box-shadow: inset 0 -3px 0 rgb(170 140 0 / .18), 0 0 0 1.5px #f3df4d, 0 8px 22px rgb(240 205 30 / .45);
    }
    .cell[aria-pressed="true"] img { opacity: 1; transform: scale(1.06); }
    .cell.blank { visibility: hidden; pointer-events: none; }
    .cell:focus-visible { outline-offset: 3px; border-radius: 28%; }

    .meter { display: flex; align-items: center; gap: .75rem; margin-top: 1rem; font-size: .8125rem; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .meter .track { flex: 1; height: .375rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .meter .fill { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--lights); transition: width .35s var(--ease); }
    .progress { margin: 0; min-width: 5.5rem; text-align: right; }

    .status { min-height: 1.4rem; margin-top: .75rem; }
    .status.success { color: #6b5d00; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .5rem; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="icon-btn" href="index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Lights Out</h1>
      <span style="width:44px" aria-hidden="true"></span>
    </header>

    <div class="stats" role="group" aria-label="Game status">
      <span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span class="sr-only">Time</span><time id="timer">00:00</time></span>
      <span class="stat"><span class="label">Moves</span><span id="moves">0</span></span>
    </div>

    <p class="goal">Tapping a bulb flips it <strong>and its neighbours</strong>. Turn every bulb on, or every bulb off.</p>

    <fieldset class="levels" id="levels">
      <legend>Difficulty</legend>
      <label><input type="radio" name="level" value="3" checked /><span>Easy<small>3×3</small></span></label>
      <label><input type="radio" name="level" value="4" /><span>Medium<small>4×4</small></span></label>
      <label><input type="radio" name="level" value="5" /><span>Hard<small>5×5</small></span></label>
      <label><input type="radio" name="level" value="cross" /><span>Special<small>Cross</small></span></label>
    </fieldset>

    <section class="panel board-wrap" aria-label="Board">
      <div class="board" id="board" role="grid" aria-label="Light bulbs"></div>
      <div class="meter"><span class="track" aria-hidden="true"><i class="fill" id="fill"></i></span><p class="progress" id="progress"></p></div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="controls">
      <button class="btn secondary" id="restartBtn">Restart</button>
      <button class="btn" id="newBtn">New puzzle</button>
    </div>
  </main>

  <dialog class="result" id="result" aria-labelledby="resultTitle">
    <img class="art" src="lightbulb_on.svg" alt="" />
    <h2 id="resultTitle">Solved!</h2>
    <p id="resultText"></p>
    <div class="figures" id="resultFigures"></div>
    <div class="actions">
      <button class="btn" id="nextBtn">Next level</button>
      <button class="btn secondary" id="againBtn">Play again</button>
      <a class="btn secondary" href="game_one.html">Try Find the Zebra</a>
    </div>
  </dialog>

  <script>
  (() => {
    const CROSS = [[0,2],[1,1],[1,2],[1,3],[2,0],[2,1],[2,2],[2,3],[2,4],[3,1],[3,2],[3,3],[4,2]];
    const LEVELS = ['3', '4', '5', 'cross'];
    const NAMES = { '3': 'Easy', '4': 'Medium', '5': 'Hard', 'cross': 'Special' };
    const $ = (s) => document.querySelector(s);
    const boardEl = $('#board'), movesEl = $('#moves'), timerEl = $('#timer'), statusEl = $('#status');

    let level = '3', n = 3, active, grid, start, moves, seconds, timerId, solved, focusIdx = 0;

    const key = (r, c) => r * n + c;
    const isActive = (r, c) => r >= 0 && c >= 0 && r < n && c < n && active[key(r, c)];
    const activeCells = () => active.flatMap((a, i) => a ? [i] : []);

    function setup(lv) {
      level = lv; n = lv === 'cross' ? 5 : +lv;
      active = Array(n * n).fill(lv !== 'cross');
      if (lv === 'cross') CROSS.forEach(([r, c]) => active[key(r, c)] = true);
      boardEl.style.setProperty('--n', n);
      boardEl.innerHTML = '';
      for (let r = 0; r < n; r++) {
        const row = document.createElement('div');
        row.setAttribute('role', 'row'); row.style.display = 'contents';
        for (let c = 0; c < n; c++) {
          const b = document.createElement('button');
          b.className = 'cell'; b.dataset.i = key(r, c);
          b.setAttribute('role', 'gridcell');
          if (!active[key(r, c)]) { b.classList.add('blank'); b.tabIndex = -1; b.setAttribute('aria-hidden', 'true'); }
          b.innerHTML = '<img alt="" />';
          row.appendChild(b);
        }
        boardEl.appendChild(row);
      }
    }

    function flip(g, i) {
      const r = Math.floor(i / n), c = i % n;
      for (const [dr, dc] of [[0,0],[0,1],[0,-1],[1,0],[-1,0]]) {
        if (isActive(r + dr, c + dc)) g[key(r + dr, c + dc)] = !g[key(r + dr, c + dc)];
      }
    }
    const isSolved = (g) => { const v = activeCells().map(i => g[i]); return v.every(Boolean) || v.every(x => !x); };

    function scramble() {
      const cells = activeCells(), count = level === 'cross' ? 15 : n * 2;
      let g;
      do {                                   // never hand out an already-solved board
        g = Array(n * n).fill(false);
        for (let k = 0; k < count; k++) flip(g, cells[Math.floor(Math.random() * cells.length)]);
      } while (isSolved(g));
      return g;
    }

    function render() {
      const cells = activeCells();
      let lit = 0;
      boardEl.querySelectorAll('.cell').forEach(b => {
        const i = +b.dataset.i; if (!active[i]) return;
        const on = grid[i]; if (on) lit++;
        b.setAttribute('aria-pressed', String(on));
        b.querySelector('img').src = on ? 'lightbulb_on.svg' : 'lightbulb_off.svg';
        const r = Math.floor(i / n) + 1, c = i % n + 1;
        b.setAttribute('aria-label', `Row ${r}, column ${c}, ${on ? 'on' : 'off'}`);
        b.tabIndex = i === focusIdx ? 0 : -1;
      });
      $('#progress').textContent = `${lit} of ${cells.length} on`;
      $('#fill').style.width = `${lit / cells.length * 100}%`;
      movesEl.textContent = moves;
    }

    function tick() {
      seconds = Math.floor((Date.now() - start) / 1000);
      timerEl.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }
    function stopTimer() { clearInterval(timerId); timerId = null; }

    function newGame(fresh = true) {
      if (fresh) { initial = scramble(); }
      grid = initial.slice();
      moves = 0; solved = false; start = null; stopTimer();
      timerEl.textContent = '00:00';
      focusIdx = activeCells()[Math.floor(activeCells().length / 2)];
      statusEl.className = 'status'; statusEl.textContent = '';
      render();
    }
    let initial;

    boardEl.addEventListener('click', (e) => {
      const b = e.target.closest('.cell'); if (!b || solved) return;
      const i = +b.dataset.i;
      if (!start) { start = Date.now(); timerId = setInterval(tick, 250); }
      flip(grid, i); moves++; focusIdx = i;
      render();
      if (isSolved(grid)) win();
    });

    // arrow-key navigation across the bulbs (skips the empty corners of the cross)
    boardEl.addEventListener('keydown', (e) => {
      const d = { ArrowUp: [-1,0], ArrowDown: [1,0], ArrowLeft: [0,-1], ArrowRight: [0,1] }[e.key];
      if (!d) return;
      e.preventDefault();
      let r = Math.floor(focusIdx / n), c = focusIdx % n;
      for (let step = 0; step < n; step++) {
        r += d[0]; c += d[1];
        if (r < 0 || c < 0 || r >= n || c >= n) return;
        if (active[key(r, c)]) break;
      }
      focusIdx = key(r, c); render();
      boardEl.querySelector(`[data-i="${focusIdx}"]`).focus();
    });

    function win() {
      solved = true; tick(); stopTimer();
      const allOn = activeCells().every(i => grid[i]);
      statusEl.className = 'status success';
      statusEl.textContent = `Solved in ${timerEl.textContent} with ${moves} moves.`;
      $('#resultText').textContent = allOn ? 'Every bulb is shining.' : 'Every bulb is off.';
      $('#resultFigures').innerHTML = `<div><strong>${timerEl.textContent}</strong>Time</div><div><strong>${moves}</strong>Moves</div>`;
      const next = LEVELS[LEVELS.indexOf(level) + 1];
      // after the last level the main button replays it instead of moving on
      $('#nextBtn').textContent = next ? `Next: ${NAMES[next]}` : 'Play again';
      $('#againBtn').hidden = !next;
      setTimeout(() => $('#result').showModal(), 500);
    }

    $('#levels').addEventListener('change', (e) => { setup(e.target.value); newGame(); });
    $('#newBtn').addEventListener('click', () => newGame());
    $('#restartBtn').addEventListener('click', () => newGame(false));
    $('#againBtn').addEventListener('click', () => { $('#result').close(); newGame(); });
    $('#nextBtn').addEventListener('click', () => {
      const next = LEVELS[LEVELS.indexOf(level) + 1];
      $('#result').close();
      if (!next) { newGame(); return; }
      document.querySelector(`input[name="level"][value="${next}"]`).checked = true;
      setup(next); newGame();
    });

    setup('3'); newGame();
  })();
  </script>
</body>
</html>
