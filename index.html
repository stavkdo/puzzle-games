<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="mainFavicon.svg" type="image/svg+xml" />
  <title>Puzzle Games by Stav Kdoshim</title>
  <style>
    /* The original entrance artwork (Group32.png, 1424×2460) shown in two slices so the
       Zip card in the middle is left out:
         top slice    = rows 0–250     (title and subtitle)
         bottom slice = rows 1015–2460 (Zebra and Lights Out cards)
       Together they make a 1424×1695 card. */
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
    .stage { display: grid; place-items: center; height: 100svh; padding: 1vmin; box-sizing: border-box; }
    .card {
      position: relative;
      aspect-ratio: 1424 / 1695;
      width: min(calc(100vw - 2vmin), calc((100svh - 2vmin) * 1424 / 1695));
      max-width: 620px;
      display: grid;
      grid-template-rows: 250fr 1445fr;
    }
    .slice { background: url('Group32.png') no-repeat; background-size: 100% auto; }
    .slice.top { background-position: 0 0; }
    .slice.bottom { background-position: 0 100%; }

    /* The original green and yellow buttons, over the "Solve" pills in the artwork. */
    .enter {
      position: absolute; left: 80.5%;
      width: 17.8%; aspect-ratio: 64 / 33;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: no-repeat center / contain;
      transition: transform .2s cubic-bezier(.2, 1.1, .3, 1);
    }
    .enter:hover { transform: translate(-50%, -50%) scale(1.06); }
    .enter:active { transform: translate(-50%, -50%) scale(.96); }
    .enter:focus-visible { outline: 3px solid #1d2125; outline-offset: 3px; }
    .enter.zebra  { top: 34.4%;  background-image: url('greenButton.svg'); }
    .enter.lights { top: 75.75%; background-image: url('yellowButton.svg'); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { .enter { transition: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="card">
      <h1 class="sr-only">Connect over fun, daily games</h1>
      <div class="slice top" aria-hidden="true"></div>
      <div class="slice bottom" aria-hidden="true"></div>
      <a class="enter zebra" href="game_one.html" aria-label="Play Zebra: use your logical reasoning skills to find out who has the zebra"></a>
      <a class="enter lights" href="game_two.html" aria-label="Play Lights Out: use your strategic thinking skills to turn on or off all the lights"></a>
    </div>
  </main>
</body>
</html>
